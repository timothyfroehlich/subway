name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    name: Python Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python and Ruff
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518  # ratchet:jdx/mise-action@v4.2.5
        with:
          install: true
          cache: true
          install_args: "python ruff"

      - name: Verify Python version
        run: |
          set -euo pipefail
          python_version="$(python3 --version | cut -d' ' -f2)"
          expected_python="$(python3 -c 'import tomllib; print(tomllib.load(open("mise.toml", "rb"))["tools"]["python"])')"
          if [[ "$python_version" != "$expected_python" ]]; then
            echo "::error::Python version mismatch: expected ${expected_python}, got ${python_version}"
            exit 1
          fi
          echo "Python ${python_version}"

      - name: Install test dependencies
        run: python -m pip install pytest

      - name: Run Ruff Linter
        run: ruff check .

      - name: Run Ruff Formatter Check
        run: ruff format --check .

      - name: Run Pytest
        run: pytest tests/

  shell:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run shellcheck
        run: shellcheck bin/subway

  node:
    name: Node Hook Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Syntax check hooks
        run: |
          node -c hooks/subway-file-size.cjs
          node -c hooks/subway-bash-read.cjs
          node -c lib/resolve-command.cjs
